name: Deploy to cPanel (FTP)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      # kkyftams@kkyfglobal.org is chrooted to the kkyftams/ folder, which is
      # reached via kkyfglobal.org/kkyftams (a path under the parent domain's
      # own document root, not a docroot we can point at public/ ourselves).
      # So the repo is synced as-is (app/, public/, migrations/, scripts/ all
      # stay siblings, matching the codebase's own relative-path assumptions),
      # and the root .htaccess transparently routes requests into public/
      # while denying direct access to app/, migrations/, scripts/, .env.
      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            **/.DS_Store
            README.md
            AGENTS.md
            DEPLOY.md
            doc/**
            ui-inspo/**

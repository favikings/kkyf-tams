<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - KKYF Fellowship</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00BD06">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #f8fafc;
            color: #0f172a;
            font-family: "Segoe UI", Arial, sans-serif;
            box-sizing: border-box;
        }

        * {
            box-sizing: border-box;
        }

        .offline-card {
            width: min(100%, 420px);
            border: 1px solid #dbe5dd;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 20px 48px rgba(15, 23, 42, 0.08);
            padding: 32px 28px;
            text-align: center;
        }

        .offline-icon-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .offline-icon {
            display: grid;
            width: 88px;
            height: 88px;
            place-items: center;
            border-radius: 999px;
            background: #f1f5f9;
            color: #94a3b8;
        }

        .offline-card h1 {
            margin: 0 0 10px;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .offline-card p {
            margin: 0 0 22px;
            color: #475569;
            line-height: 1.6;
        }

        .offline-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 999px;
            background: #00bd06;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(0, 189, 6, 0.18);
        }

        .offline-button:hover {
            background: #00a305;
        }
    </style>
</head>

<body>
    <div class="offline-card">
        <div class="offline-icon-wrap">
            <div class="offline-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2" width="48" height="48" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 3l18 18M12.44 12.44A5.002 5.002 0 0112 17a5 5 0 01-4-9M16.24 7.76a9 9 0 014.76 4.76M5.636 5.636a9 9 0 0112.728 0M1 1l22 22" />
                </svg>
            </div>
        </div>

        <h1>You are Offline</h1>
        <p>Check your connection and try again.</p>

        <button onclick="window.location.reload()" class="offline-button">
            Try Again
        </button>
    </div>
</body>

</html>
